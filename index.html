  if(e.target instanceof Element && e.target.closest('.pfp-avatar-wrap')) return;
  document.querySelectorAll('.pfp-avatar-wrap.expanded').forEach(w => {
    w.classList.remove('expanded');
    w.setAttribute('aria-expanded', 'false');
  });
});

function updatePresenceCard(id, data){
  const nodes = pfpNodes[id];
  if(!nodes || !data) return;

  const user = data.discord_user || {};
  if(user.bot || isBotLikeName(user.global_name || user.username || '')){
    if(nodes.item && nodes.item.parentNode){
      nodes.item.parentNode.removeChild(nodes.item);
    }
    delete pfpNodes[id];
    return;
  }

  const displayName = user.global_name || user.username || nodes.nameLabel.textContent;
  nodes.nameLabel.textContent = displayName;
  nodes.popupName.textContent = displayName;

  if(user.id){
    const ext = user.avatar && user.avatar.startsWith('a_') ? 'gif' : 'png';
    nodes.avatar.src = user.avatar
      ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=128`
      : defaultAvatar;
  }

  const decorAsset = user.avatar_decoration_data && user.avatar_decoration_data.asset;
  if(decorAsset){
    nodes.decor.src = `https://cdn.discordapp.com/avatar-decoration-presets/${decorAsset}.png?size=160`;
    nodes.decor.classList.add('show');
  } else {
    nodes.decor.classList.remove('show');
  }

  const status = data.discord_status || 'offline';
  const color = statusColor[status] || statusColor.offline;
  const label = statusLabel[status] || statusLabel.offline;
  nodes.dot.style.background = color;
  nodes.dot.style.boxShadow = `0 0 7px 0 ${color}`;
  nodes.popupStatusDot.style.background = color;
  nodes.popupStatusDot.style.boxShadow = `0 0 6px 0 ${color}`;
  nodes.popupStatusLabel.textContent = label;

  const activities = data.activities || [];
  const act = activities.find(a => a.type !== 4);
  if(act){
    const imgUrl = buildActivityImage(act);
    nodes.rpcIconSlot.innerHTML = '';
    if(imgUrl){
      const img = document.createElement('img');
      img.src = imgUrl;
      img.alt = '';
      nodes.rpcIconSlot.appendChild(img);
    }
    nodes.rpcText.textContent = act.name || 'Activity';
  } else {
    nodes.rpcIconSlot.innerHTML = '';
    nodes.rpcText.textContent = 'No Activity';
  }
}

let socket = null;
let heartbeatTimer = null;
function connectLanyard(){
  socket = new WebSocket('wss://api.lanyard.rest/socket');
  socket.onopen = () => {
    socket.send(JSON.stringify({op:2, d:{subscribe_to_ids:memberIds}}));
  };
  socket.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if(msg.op === 1){
      const interval = msg.d.heartbeat_interval;
      clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(()=>{
        if(socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({op:3}));
      }, interval);
    }
    if(msg.t === 'INIT_STATE'){
      Object.keys(msg.d).forEach(id => updatePresenceCard(id, msg.d[id]));
    }
    if(msg.t === 'PRESENCE_UPDATE'){
      const uid = msg.d.discord_user && msg.d.discord_user.id;
      if(uid) updatePresenceCard(uid, msg.d);
    }
  };
  socket.onclose = () => {
    clearInterval(heartbeatTimer);
    setTimeout(connectLanyard, 3000);
  };
  socket.onerror = () => {
    socket.close();
  };
}
connectLanyard();

const nameTicker = document.getElementById('nameTicker');
let tickerIndex = 0;
let tickerTimer = null;
function getTickerNames(){
  return memberIds.filter(id => pfpNodes[id] && pfpNodes[id].nameLabel.textContent).map(id => pfpNodes[id].nameLabel.textContent);
}
function tickName(){
  clearTimeout(tickerTimer);
  const names = getTickerNames();
  if(!names.length){
    nameTicker.classList.remove('show');
    tickerTimer = setTimeout(tickName, 1500);
    return;
  }
  if(tickerIndex >= names.length) tickerIndex = 0;
  nameTicker.textContent = names[tickerIndex];
  nameTicker.classList.add('show');
  tickerIndex++;
  tickerTimer = setTimeout(() => {
    nameTicker.classList.remove('show');
    tickerTimer = setTimeout(tickName, 500);
  }, 1800);
}
tickName();

function buildMemberChip(member){
  const chip = document.createElement('div');
  chip.className = 'member-chip';

  const avatarWrap = document.createElement('div');
  avatarWrap.className = 'member-avatar-wrap';

  const avatar = document.createElement('img');
  avatar.className = 'member-avatar';
  avatar.src = member.avatar_url || defaultAvatar;
  avatar.alt = '';

  const dot = document.createElement('span');
  dot.className = 'member-status-dot';
  const dotColor = statusColor[member.status] || statusColor.offline;
  dot.style.background = dotColor;
  dot.style.boxShadow = `0 0 6px 0 ${dotColor}`;

  avatarWrap.appendChild(avatar);
  avatarWrap.appendChild(dot);

  const name = document.createElement('div');
  name.className = 'member-name';
  name.textContent = member.username || 'member';

  chip.appendChild(avatarWrap);
  chip.appendChild(name);

  chip.addEventListener('mouseenter', () => showMemberPopup(member, chip));
  chip.addEventListener('mouseleave', hideMemberPopup);
  chip.addEventListener('click', (e) => {
    e.stopPropagation();
    showMemberPopup(member, chip);
  });

  return chip;
}

function renderMemberRow(container, members){
  container.innerHTML = '';
  if(!members.length) return;

  const minChipCount = Math.max(20, Math.ceil((window.innerWidth + 160) / 80));
  const sequence = Array.from(
    {length:minChipCount},
    (_, index) => members[index % members.length]
  );
  sequence.concat(sequence).forEach(member => container.appendChild(buildMemberChip(member)));
}

let marqueeMemberGroups = null;
let marqueeResizeTimer = null;
addEventListener('resize', () => {
  clearTimeout(marqueeResizeTimer);
  marqueeResizeTimer = setTimeout(() => {
    if(!marqueeMemberGroups) return;
    renderMemberRow(document.getElementById('marqueeTop'), marqueeMemberGroups.top);
    renderMemberRow(document.getElementById('marqueeBottom'), marqueeMemberGroups.bottom);
  }, 150);
});

function showMemberPopup(member, anchorEl){
  const popup = document.getElementById('memberPopup');
  document.getElementById('memberPopupPfp').src = member.avatar_url || defaultAvatar;
  document.getElementById('memberPopupName').textContent = member.username || 'member';
  const status = member.status || 'offline';
  const popupStatusColor = statusColor[status] || statusColor.offline;
  const statusDot = document.getElementById('memberPopupStatusDot');
  statusDot.style.background = popupStatusColor;
  statusDot.style.boxShadow = `0 0 6px 0 ${popupStatusColor}`;
  document.getElementById('memberPopupStatusText').textContent = statusLabel[status] || statusLabel.offline;

  const arrow = popup.querySelector('.member-popup-arrow');
  popup.classList.remove('show');
  requestAnimationFrame(() => {
    const rect = anchorEl.getBoundingClientRect();
    const pw = 160;
    const ph = 150;
    let left = rect.left + rect.width / 2 - pw / 2;
    let top = rect.top - ph - 14;
    let flipped = false;
    if(top < 70){ top = rect.bottom + 10; flipped = true; }
    if(left < 10) left = 10;
    if(left + pw > window.innerWidth - 10) left = window.innerWidth - pw - 10;
    const arrowLeft = Math.max(16, Math.min(pw - 30, (rect.left + rect.width / 2) - left - 7));
    arrow.style.left = arrowLeft + 'px';
    if(flipped){
      arrow.style.top = '-7px';
      arrow.style.bottom = 'auto';
      arrow.style.borderTop = 'none';
      arrow.style.borderBottom = '7px solid rgba(20,20,26,.74)';
    } else {
      arrow.style.bottom = '-7px';
      arrow.style.top = 'auto';
      arrow.style.borderBottom = 'none';
      arrow.style.borderTop = '7px solid rgba(20,20,26,.74)';
    }
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
    popup.classList.add('show');
    const row = anchorEl.closest('.marquee-row');
    if(row) row.style.animationPlayState = 'paused';
  });
}

function hideMemberPopup(){
  document.getElementById('memberPopup').classList.remove('show');
  document.querySelectorAll('.marquee-row').forEach(r => r.style.animationPlayState = 'running');
}

document.addEventListener('click', (e) => {
  const popup = document.getElementById('memberPopup');
  if(popup.classList.contains('show') && !e.target.closest('.member-chip')){
    hideMemberPopup();
  }
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') hideMemberPopup();
});

function extractInviteCode(url){
  const match = (url || '').match(/discord(?:\.gg|\.com\/invite)\/([a-zA-Z0-9-]+)/);
  return match ? match[1] : null;
}

let resolvedGuildId = guildId;

function applyServerIcon(iconUrl){
  if(!iconUrl) return;
  document.getElementById('serverIcon').src = iconUrl;
}

function updateServerStats(memberCount, onlineCount){
  const total = typeof memberCount === 'number' ? memberCount : null;
  const online = typeof onlineCount === 'number' ? onlineCount : null;
  const offline = (total !== null && online !== null) ? Math.max(total - online, 0) : null;
  document.getElementById('statMembers').textContent = 'Members: ' + (total !== null ? total.toLocaleString() : '—');
  document.getElementById('statOnline').textContent = 'Online: ' + (online !== null ? online.toLocaleString() : '—');
  document.getElementById('statOffline').textContent = 'Offline: ' + (offline !== null ? offline.toLocaleString() : '—');
}

function fetchWidgetMembers(guildId){
  fetch(`https://discord.com/api/guilds/${guildId}/widget.json`)
    .then(res => res.json())
    .then(data => {
      if(data.instant_invite) document.getElementById('serverLink').href = data.instant_invite;
      const members = (data.members || []).filter(member => isRealMemberEntry(member));
      if(!members.length) throw new Error('widget empty');
      const half = Math.max(1, Math.ceil(members.length / 2));
      const topMembers = members.slice(0, half);
      const bottomMembers = members.slice(half).length ? members.slice(half) : members;
      marqueeMemberGroups = {top:topMembers, bottom:bottomMembers};
      renderMemberRow(document.getElementById('marqueeTop'), topMembers);
      renderMemberRow(document.getElementById('marqueeBottom'), bottomMembers);
    })
    .catch(() => {
      document.getElementById('marqueeTop').innerHTML = '<div class="marquee-empty">members unavailable — enable server widget in discord settings</div>';
      document.getElementById('marqueeBottom').innerHTML = '';
    });
}

function loadServerStats(){
  const code = extractInviteCode(serverInviteUrl);
  if(!code) return;
  fetch(`https://discord.com/api/v10/invites/${code}?with_counts=true`)
    .then(res => res.json())
    .then(data => {
      if(data.guild){
        if(!serverIconUrl && data.guild.icon){
          applyServerIcon(`https://cdn.discordapp.com/icons/${data.guild.id}/${data.guild.icon}.png?size=128`);
        }
        if(!resolvedGuildId && data.guild.id){
          resolvedGuildId = data.guild.id;
          fetchWidgetMembers(resolvedGuildId);
        }
      }
      updateServerStats(data.approximate_member_count, data.approximate_presence_count);
    })
    .catch(() => {});
}

function loadGuildWidget(){
  if(resolvedGuildId) fetchWidgetMembers(resolvedGuildId);
  loadServerStats();
}

if(serverIconUrl) applyServerIcon(serverIconUrl);
loadGuildWidget();
setInterval(loadGuildWidget, 60000);

const gate = document.getElementById('gate');
const mainEl = document.getElementById('main');
const bgMusic = document.getElementById('bgMusic');
const enterBtn = document.getElementById('enterBtn');
const enterIcon = document.getElementById('enterIcon');
const enterSub = document.getElementById('enterSub');

function enterSite(){
  gate.classList.add('entering');
  enterIcon.classList.add('spin');
  enterBtn.style.pointerEvents = 'none';
  enterBtn.style.opacity = '0';
  setTimeout(() => {
    enterSub.classList.add('visible');

    gate.classList.add('hide');
    document.body.classList.remove('locked');

}

enterBtn.addEventListener('click', enterSite);

function spawnRipple(x, y){
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.left = x + 'px';
  r.style.top = y + 'px';
  document.body.appendChild(r);
  r.addEventListener('animationend', () => r.remove());
}
document.addEventListener('pointerdown', (e) => {
  spawnRipple(e.clientX, e.clientY);
});

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const bgImageUrl = 'https://file.garden/aTb25HYRBGMg114K/1788615067464.jpg';
const bgToggle = document.getElementById('bgToggle');
const bgImageEl = document.getElementById('bgImage');
const glowEl = document.querySelector('.glow');
let bgAlt = true;
bgImageEl.style.backgroundImage = `url('${bgImageUrl}')`;
bgToggle.addEventListener('click', () => {
  bgAlt = !bgAlt;
  bgToggle.classList.toggle('alt', bgAlt);
  bgImageEl.classList.toggle('show', bgAlt);
  glowEl.classList.toggle('hide', bgAlt);
});

const bgCanvas = document.getElementById('bg');
const ctx = bgCanvas.getContext('2d');
let bw, bh;
function resizeCanvas(){
  bw = bgCanvas.width = innerWidth;
  bh = bgCanvas.height = innerHeight;
}
resizeCanvas();
addEventListener('resize', resizeCanvas);

const particles = Array.from({length:34}, () => ({
  x: Math.random() * bw,
  y: Math.random() * bh,
  r: 0.6 + Math.random() * 1.5,
  s: 0.08 + Math.random() * 0.22,
  a: 0.08 + Math.random() * 0.22
}));

let targetParX = 0, targetParY = 0, curParX = 0, curParY = 0;
addEventListener('pointermove', (e) => {
  targetParX = (e.clientX / innerWidth - 0.5) * 34;
  targetParY = (e.clientY / innerHeight - 0.5) * 34;
});

function drawBackground(){
  curParX += (targetParX - curParX) * 0.05;
  curParY += (targetParY - curParY) * 0.05;
  ctx.clearRect(0, 0, bw, bh);
  particles.forEach(p => {
    const depth = p.r / 2.1;
    const px = p.x + curParX * depth;
    const py = p.y + curParY * depth;
    ctx.beginPath();
    ctx.fillStyle = `rgba(40,40,40,${p.a})`;
    ctx.arc(px, py, p.r, 0, Math.PI * 2);
    ctx.fill();
    p.y -= p.s;
    if(p.y < -10){
      p.y = bh + 10;
      p.x = Math.random() * bw;
    }
  });
  requestAnimationFrame(drawBackground);
}
if(!reduceMotion){
  drawBackground();
}
